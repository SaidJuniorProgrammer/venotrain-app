version: '3.8'
services:
  db:
    image: postgres:15
    container_name: venotrain_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: venotrain
    ports:
      - "5433:5432"
    volumes:
      - venotrain_pgdata:/var/lib/postgresql/data

volumes:
  venotrain_pgdata: